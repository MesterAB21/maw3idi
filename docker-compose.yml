services:
  maw3idi:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - API_BACKEND_URL=https://maw3idi-backend.onrender.com
        - META_APP_SECRET=${META_APP_SECRET:-maw3idi-test-meta-app-secret}
        - NEXT_PUBLIC_TEST_AGENT_URL=${NEXT_PUBLIC_TEST_AGENT_URL:-https://maw3idi-agent.onrender.com/webhooks/test}
    container_name: maw3idi-frontend
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    networks:
      - default
      - maw3idi-net

networks:
  maw3idi-net:
    name: maw3idi-net
    external: true